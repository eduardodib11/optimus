[package]
name = "acpid-fuzz"
description = "Alvos de fuzz do acpid (AML, T-405/T-421; ADR 0045). Fora da imagem: só ferramenta de fuzzing, nightly."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Crate própria, fora do workspace principal: `libfuzzer-sys` nunca entra na
# imagem do sistema nem no `cargo xtask build`.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
acpid = { path = "../../services/acpid" }

[[bin]]
name = "aml"
path = "fuzz_targets/aml.rs"
test = false
doc = false
bench = false
