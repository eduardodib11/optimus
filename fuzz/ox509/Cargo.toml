[package]
name = "ox509-fuzz"
description = "Alvo de fuzz do parser X.509 do tlsd (T-650; ADR 0071, item 3). Fora da imagem: só ferramenta de fuzzing, nightly."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Crate própria, fora do workspace principal: `libfuzzer-sys` nunca entra na
# imagem do sistema nem no `cargo xtask build`.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ox509 = { path = "../../lib/ox509" }

[[bin]]
name = "cert"
path = "fuzz_targets/cert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ocsp"
path = "fuzz_targets/ocsp.rs"
test = false
doc = false
bench = false
