name: Bench em KVM

# Medição das metas de desempenho (T-302, T-331) num runner hospedado com
# KVM. Roda à mão (workflow_dispatch) e nos PRs que mudam este arquivo.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/bench-kvm.yml

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: KVM no runner
        run: |
          grep -m1 "model name" /proc/cpuinfo
          echo "vmx/svm: $(grep -cE 'vmx|svm' /proc/cpuinfo)"
          ls -l /dev/kvm
          # O /dev/kvm dos runners é do grupo kvm; a regra o abre ao usuário.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: QEMU e OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Toolchain fixada em rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Bench com 1 CPU
        run: cargo xtask bench
      - name: Bench com 4 CPUs
        run: cargo xtask bench --smp 4
      - name: Relatórios no resumo
        if: always()
        run: |
          for f in $(git ls-files --others --exclude-standard docs/bench); do
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-kvm
          path: docs/bench/*.md
