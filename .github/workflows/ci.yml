name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain fixada em rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Formatação, clippy e allowlist de unsafe
        run: cargo xtask check

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: QEMU e OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Toolchain fixada em rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Testes unitários, smoke test de boot, testes de kernel e de usuário no QEMU
        run: cargo xtask test all
      - name: Um teste de usuário que falha de propósito tem de derrubar o comando
        run: |
          if cargo xtask test user --falha-proposital; then
            echo "o teste que falha de propósito passou" >&2
            exit 1
          fi

  smp:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cpus: [2, 4]
    name: smp (${{ matrix.cpus }} CPUs)
    steps:
      - uses: actions/checkout@v5
      - name: QEMU e OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Toolchain fixada em rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Testes de kernel no QEMU com ${{ matrix.cpus }} CPUs
        run: cargo xtask test smp --smp ${{ matrix.cpus }}

  # Miri sobre os testes do alocador (ADR 0039, item 1): só nos PRs que mudam
  # a lib/oalloc. O GitHub Actions não filtra `paths` por job, então o job
  # roda sempre no PR e pula os passos se a crate não mudou. O job noturno de
  # Miri da seção 16.4 não existe de propósito (decisão de 2026-10-20).
  miri:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: A lib/oalloc mudou neste PR?
        id: changed
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -q '^lib/oalloc/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "lib/oalloc não mudou: Miri não roda."
          fi
      - name: Nightly com Miri (único uso de nightly no CI)
        if: steps.changed.outputs.run == 'true'
        run: |
          rustup toolchain install nightly --profile minimal --component miri
          cargo +nightly miri setup
      - name: Testes do oalloc sob Miri
        if: steps.changed.outputs.run == 'true'
        run: cargo +nightly miri test -p oalloc
