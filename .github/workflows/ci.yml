name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain fixada em rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Formatação, clippy e allowlist de unsafe
        run: cargo xtask check

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: QEMU e OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      # O amd-iommu do QEMU 8.2 do Ubuntu não atualiza a cauda do log de
      # eventos (ADR 0055; T-510): os boots com AMD-Vi usam o 10.1.
      - name: QEMU 10.1 para o AMD-Vi (cache)
        id: qemu-amd
        uses: actions/cache@v4
        with:
          path: ~/qemu-amd
          key: qemu-amd-${{ hashFiles('tools/qemu-amd.sh') }}-ubuntu-24.04
      - name: QEMU 10.1 para o AMD-Vi (compilação)
        if: steps.qemu-amd.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y ninja-build libglib2.0-dev libpixman-1-dev libslirp-dev python3-venv flex bison
          tools/qemu-amd.sh ~/qemu-amd
      - name: QEMU 10.1 para o AMD-Vi (variável)
        run: echo "OPTIMUS_QEMU_AMD=$HOME/qemu-amd/bin/qemu-system-x86_64" >> "$GITHUB_ENV"
      - name: Toolchain fixada em rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Testes unitários, smoke test de boot, testes de kernel e de usuário no QEMU
        run: cargo xtask test all
      - name: Um teste de usuário que falha de propósito tem de derrubar o comando
        run: |
          if cargo xtask test user --falha-proposital; then
            echo "o teste que falha de propósito passou" >&2
            exit 1
          fi

  smp:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cpus: [2, 4]
    name: smp (${{ matrix.cpus }} CPUs)
    steps:
      - uses: actions/checkout@v5
      - name: QEMU e OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Toolchain fixada em rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Testes de kernel no QEMU com ${{ matrix.cpus }} CPUs
        run: cargo xtask test smp --smp ${{ matrix.cpus }}

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: QEMU e OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Toolchain fixada em rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cenário de integração em -smp 1 e -smp 4 (T-365)
        run: cargo xtask test integration
      - name: Teste de caos, 100 mortes aleatórias em -smp 4 (T-366)
        run: cargo xtask test chaos
      - name: Armazenamento, formato, GPT e OptFS (T-531)
        run: cargo xtask test storage

  # Miri sobre os testes do alocador (ADR 0039, item 1): só nos PRs que mudam
  # a lib/oalloc. O GitHub Actions não filtra `paths` por job, então o job
  # roda sempre no PR e pula os passos se a crate não mudou. O job noturno de
  # Miri da seção 16.4 não existe de propósito (decisão de 2026-10-20).
  miri:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: O oalloc, a toolchain ou este workflow mudaram neste PR?
        id: changed
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -Eq '^(lib/oalloc/|Cargo\.lock|rust-toolchain\.toml|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nada que afete o oalloc mudou: Miri não roda."
          fi
      - name: Nightly com Miri (único uso de nightly no CI; data fixada)
        if: steps.changed.outputs.run == 'true'
        run: |
          rustup toolchain install nightly-2026-08-21 --profile minimal --component miri
          cargo +nightly-2026-08-21 miri setup
      - name: Testes do oalloc sob Miri
        if: steps.changed.outputs.run == 'true'
        run: cargo +nightly-2026-08-21 miri test -p oalloc
