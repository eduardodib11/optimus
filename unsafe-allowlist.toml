# Crates autorizadas a usar `unsafe` (SDD v1.0, seção 17.1).
# Todas as outras DEVEM declarar `#![forbid(unsafe_code)]`; `cargo xtask check` verifica.
crates = [
    "boot/optboot",
    "kernel/okernel",
    # "ostd baixo nível" (seção 17.1): só `lib/ostd/src/arch/` (syscall e _start).
    "lib/ostd",
]
