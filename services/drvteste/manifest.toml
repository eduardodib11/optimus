# Driver de teste do `devmgr` (ADR 0042; T-401): casa só com o dispositivo
# `edu` do QEMU (1234:11e8). Não parte no boot; o `devmgr` o pede.
[service]
name = "drvteste"
binary = "drvteste"
priority = 120
restart = "never"

[capabilities]
needs = ["mem:quota:512KiB", "kernel:debug"]
provides = []

[match]
pci = ["1234:11e8"]

[limits]
max_threads = 1
