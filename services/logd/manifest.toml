# Manifesto do `logd` (ADR 0034, item 4; ADR 0036, itens 4 e 6): lê o anel
# do log do kernel e guarda as linhas em memória.
[service]
name = "logd"
binary = "logd"
priority = 150
restart = "always"

[capabilities]
needs = ["mem:quota:2816KiB", "kernel:debug", "kernel:log"]
provides = ["optimus.log.Log@1.0"]

[limits]
max_threads = 1
