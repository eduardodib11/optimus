# Manifesto do `pcid` (ADR 0043; T-402): a janela ECAM, o log de depuração
# e o `DeviceBus` do `devmgr`. Lê o espaço de configuração e nunca liga bus
# master.
[service]
name = "pcid"
binary = "pcid"
priority = 140
restart = "never"

[capabilities]
needs = ["mem:quota:1MiB", "kernel:debug", "kernel:ecam", "svc:optimus.dev.DeviceBus@1"]
provides = []

[limits]
max_threads = 1
