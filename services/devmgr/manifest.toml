# Manifesto do `devmgr` (ADR 0042, item 1; T-401): recebe os nós do `pcid`
# e do `acpid` pelo `DeviceBus`.
[service]
name = "devmgr"
binary = "devmgr"
priority = 140
restart = "on-failure"

[capabilities]
needs = ["mem:quota:3MiB", "kernel:debug"]
provides = ["optimus.dev.DeviceBus@1.0"]

[limits]
max_threads = 1
