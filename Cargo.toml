[workspace]
resolver = "3"
members = ["xtask", "boot/optboot", "kernel/kabi", "kernel/okernel", "lib/oalloc", "lib/obfs", "lib/oelf", "lib/optcrypt", "lib/ostd", "services/hello", "services/root", "services/utest", "fuzz/okfuzz", "tools/mkobfs"]
# Só o xtask roda no host (os testes das bibliotecas também); as demais crates
# são compiladas por `cargo xtask build`.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/eduardodib11/optimus"

[workspace.lints.rust]
missing_docs = "deny"
# `cfg(kani)`: provas do Kani (`cargo xtask kani`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
