[workspace]
resolver = "3"
members = ["xtask", "boot/optboot", "kernel/kabi", "kernel/okernel", "lib/oalloc", "lib/obfs", "lib/ocoll", "lib/oelf", "lib/oidl-rt", "lib/optcrypt", "lib/ostd", "services/hello", "services/root", "services/utest", "fuzz/okfuzz", "tools/mkobfs"]
# Só o xtask roda no host (os testes das bibliotecas também); as demais crates
# são compiladas por `cargo xtask build`.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/eduardodib11/optimus"

[workspace.lints.rust]
missing_docs = "deny"
# `cfg(kani)`: provas do Kani (`cargo xtask kani`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
panic = "abort"

# O bootfs guarda o `utest` no heap do kernel e come a cota dos testes de
# usuário; sem informação de depuração ele fica pequeno (T-336).
[profile.dev.package.utest]
debug = 0

# Idem para as bibliotecas de usuário: cada binário do bootfs leva a
# informação de depuração delas e a cota do `root` paga a cópia (T-337).
[profile.dev.package.ostd]
debug = 0

[profile.dev.package.ocoll]
debug = 0

[profile.dev.package.oalloc]
debug = 0

[profile.release]
panic = "abort"
