[workspace]
resolver = "3"
members = ["xtask", "tools/oidlc", "boot/optboot", "kernel/kabi", "kernel/okernel", "lib/oalloc", "lib/obfs", "lib/ocoll", "lib/olz4", "lib/oelf", "lib/oidl-rt", "lib/optcrypt", "lib/ostd", "lib/oman", "lib/ologd", "lib/osvc", "lib/odev", "lib/olegacy", "lib/oinput", "lib/opci", "lib/virtio-core", "lib/vdrv", "services/pcid", "services/devmgr", "services/drvteste", "services/virtio-blk", "services/virtio-rng", "services/virtio-console", "services/virtio-input", "services/virtio-net", "services/virtio-gpu", "services/hello", "services/memd", "services/root", "services/utest", "services/svcmgr", "services/timed", "services/acpid", "services/rtcd", "services/inputd", "services/i8042d", "services/ps2mouse", "services/logd", "fuzz/okfuzz", "tools/mkobfs", "tools/mkmanifest", "tools/mktz"]
# Só o xtask roda no host (os testes das bibliotecas também); as demais crates
# são compiladas por `cargo xtask build`.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/eduardodib11/optimus"

[workspace.lints.rust]
missing_docs = "deny"
# `cfg(kani)`: provas do Kani (`cargo xtask kani`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
panic = "abort"

# O bootfs guarda o `utest` no heap do kernel e come a cota dos testes de
# usuário; sem informação de depuração ele fica pequeno (T-336).
[profile.dev.package.utest]
debug = 0

# Idem para as bibliotecas de usuário: cada binário do bootfs leva a
# informação de depuração delas e a cota do `root` paga a cópia (T-337).
[profile.dev.package.ostd]
debug = 0

[profile.dev.package.memd]
debug = 0

[profile.dev.package.olz4]
debug = 0

[profile.dev.package.optcrypt]
debug = 0

[profile.dev.package.ocoll]
debug = 0

[profile.dev.package.oalloc]
debug = 0

# O `utest` lê o bootfs para carregar o filho do teste de anéis (T-339).
[profile.dev.package.obfs]
debug = 0

# O `svcmgr` entra no bootfs: sem informação de depuração, a cota do `root`
# paga só o código (T-351).
[profile.dev.package.svcmgr]
debug = 0

# O `pcid` entra no bootfs (T-402).
[profile.dev.package.pcid]
debug = 0

# O `acpid` entra no bootfs (T-405).
[profile.dev.package.acpid]
debug = 0

[profile.dev.package.opci]
debug = 0

# O `devmgr` entra no bootfs (T-401).
[profile.dev.package.devmgr]
debug = 0

[profile.dev.package.odev]
debug = 0

[profile.dev.package.drvteste]
debug = 0

[profile.dev.package.virtio-blk]
debug = 0

[profile.dev.package.virtio-rng]
debug = 0

[profile.dev.package.virtio-gpu]
debug = 0

[profile.dev.package.virtio-net]
debug = 0

[profile.dev.package.virtio-input]
debug = 0

[profile.dev.package.virtio-console]
debug = 0

# O `virtio-blk` leva a biblioteca de transporte, e a cota do `root` paga o
# bootfs (T-411).
[profile.dev.package.virtio-core]
debug = 0

[profile.dev.package.vdrv]
debug = 0

# O `rtcd` entra no bootfs (T-406).
[profile.dev.package.rtcd]
debug = 0

[profile.dev.package.olegacy]
debug = 0

# O `inputd` e o `i8042d` entram no bootfs (T-406).
[profile.dev.package.inputd]
debug = 0

[profile.dev.package.i8042d]
debug = 0

[profile.dev.package.ps2mouse]
debug = 0

[profile.dev.package.oinput]
debug = 0

# Com o `pcid` (T-402), a cópia do bootfs na cota do `root` passava do
# orçamento: os serviços e as bibliotecas deles vão sem informação de
# depuração.
[profile.dev.package.osvc]
debug = 0

[profile.dev.package.root]
debug = 0

[profile.dev.package.hello]
debug = 0

[profile.dev.package.timed]
debug = 0

[profile.dev.package.logd]
debug = 0

[profile.dev.package.ologd]
debug = 0

[profile.dev.package.oidl-rt]
debug = 0

[profile.release]
panic = "abort"
