[package]
name = "tlshost"
description = "Servidor TLS 1.3 de host para os testes do tlsd (T-654, T-657): rustls com X25519MLKEM768, certificados de teste e casos de recusa."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Fora do workspace principal, como os alvos de fuzz: `rustls` e `aws-lc-rs`
# são só ferramenta de teste e nunca entram na imagem do sistema (ADR 0003).
[workspace]

[lib]
doctest = false

[[bin]]
name = "tlshost"
path = "src/main.rs"

[dependencies]
rustls = { version = "0.23", default-features = true }

[dev-dependencies]
otls = { path = "../../lib/otls" }
ox509 = { path = "../../lib/ox509" }
optcrypt = { path = "../../lib/optcrypt" }
